name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + package only — skip release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Zig
        run: |
          bash scripts/fetch-zig.sh
          echo "$GITHUB_WORKSPACE/.zig-toolchain" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          brew update
          brew bundle install --file=Brewfile || brew install cmake webp

      - name: Build mlx + mlx-c
        run: |
          xcrun -sdk macosx metal --version >/dev/null 2>&1 || sudo xcodebuild -downloadComponent MetalToolchain || true
          bash scripts/build-mlx.sh
          ls -lh lib/mlx/lib/ || true
          cat lib/mlx/.version || true

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mlx-runner
        run: zig build -Doptimize=ReleaseFast

      - name: Smoke test
        run: |
          ./zig-out/bin/mlx-runner --version
          ./zig-out/bin/mlx-runner --metal-check
          ./zig-out/bin/mlx-runner --help > /dev/null

      - name: Package CLI tarball
        run: |
          STAGING="mlx-runner-macos-arm64"
          mkdir -p "$STAGING/lib"
          cp zig-out/bin/mlx-runner "$STAGING/"
          cp README.md "$STAGING/" 2>/dev/null || true
          cp LICENSE* NOTICE* "$STAGING/" 2>/dev/null || true
          cp lib/mlx/lib/*.dylib "$STAGING/lib/" 2>/dev/null || true
          cp lib/mlx/lib/mlx.metallib "$STAGING/lib/" 2>/dev/null || true
          # Fix rpaths for distribution
          install_name_tool -change @rpath/libmlxc.dylib @executable_path/lib/libmlxc.dylib "$STAGING/mlx-runner" 2>/dev/null || true
          install_name_tool -change @rpath/libmlx.dylib @loader_path/libmlx.dylib "$STAGING/lib/libmlxc.dylib" 2>/dev/null || true
          install_name_tool -add_rpath @loader_path "$STAGING/lib/libmlx.dylib" 2>/dev/null || true
          # Smoke test rewired binary
          "./$STAGING/mlx-runner" --version
          ditto -c -k --keepParent "$STAGING" "mlx-runner-macos-arm64.zip"
          tar -czf "mlx-runner-macos-arm64.tar.gz" "$STAGING"
          ls -lh *.zip *.tar.gz
          shasum -a 256 *.zip *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create Release (tag push only)
        if: github.ref_type == 'tag' && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: mlx-runner v${{ steps.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            mlx-runner-macos-arm64.zip
            mlx-runner-macos-arm64.tar.gz
            checksums.txt

      - name: Upload artifact (dispatch / dry_run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mlx-runner-${{ steps.version.outputs.version }}
          path: |
            mlx-runner-macos-arm64.zip
            mlx-runner-macos-arm64.tar.gz
            checksums.txt
          retention-days: 7
